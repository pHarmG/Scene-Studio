<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scene Studio Installer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6fed'/%3E%3Ctext x='16' y='23' font-size='19' font-family='sans-serif' font-weight='700' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">S</span>
      <div>
        <div class="brand-name">Scene Studio Installer</div>
        <div class="brand-sub">lighting scenes for Home Assistant</div>
      </div>
    </div>
    <div class="top-meta" id="top-meta"></div>
  </header>

  <main class="layout">
    <nav class="stepper" id="stepper" aria-label="Installer steps"></nav>
    <section class="content" id="content" aria-live="polite"></section>
  </main>

  <footer class="statusbar">
    <span id="statusbar-run">no install running</span>
    <span id="statusbar-hint"></span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
